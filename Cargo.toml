[package]
name = "aozumi-db"
version = "0.1.0"
edition = "2021"
description = "A database per app, as a file: a SQLite-compatible server that speaks libSQL's HTTP protocol"
license = "MIT"
repository = "https://github.com/AoZumi-Labs/aozumi-db"

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
hmac = "0.12"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1", "server"] }
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "ring", "tls12", "webpki-roots"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http1", "server", "tokio"] }
rand = "0.8"
# The TLS listener (src/tls.rs), on the same TLS stack and crypto provider as the S3 client.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
tokio = { version = "1", features = ["fs", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The storage engine's core API, pinned exactly: we drive its WAL directly.
turso_core = { version = "=0.8.3", features = ["conn_raw_api"] }
turso_parser = "=0.8.3"
# Backups are stored compressed: WAL frames repeat the same pages, and squeeze ~100x.
zstd = { version = "0.13", default-features = false }

[dev-dependencies]
# Certificates for the TLS listener's tests.
rcgen = { version = "0.13", default-features = false, features = ["crypto", "pem", "ring"] }
# Reading raw sockets in the TLS listener's tests.
tokio = { version = "1", features = ["io-util"] }
tempfile = "3"
# The benchmark's embedded baseline: the same YCSB workloads on SQLite's C library (examples/bench/embedded.rs).
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.dev]
# The engine is large; skipping debug info keeps target/ small on a nearly full disk.
debug = 0

[profile.release]
lto = "thin"
codegen-units = 1
