<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1010" viewBox="0 0 1280 1010" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="40" y="52" font-size="26" fill="#0b0b0b" text-anchor="start" font-weight="600">aozumi-db against other databases' published numbers</text><text x="40" y="80" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Only aozumi-db was run (AWS c7gd.2xlarge, 8 Graviton3 vCPUs). Other figures are as their authors published them, on their own hardware.</text><rect x="40" y="98" width="14" height="14" rx="3" fill="#2a78d6"/><text x="60" y="110" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, group commit</text><rect x="250" y="98" width="14" height="14" rx="3" fill="#8fb8ea"/><text x="270" y="110" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, one flush per commit (default)</text><rect x="570" y="98" width="14" height="14" rx="3" fill="#eb6834"/><text x="590" y="110" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">published figure</text><text x="40" y="160" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">Concurrent writes: Turso's perf/throughput workload, 64 connections</text><text x="40" y="182" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Transactions/s; each is BEGIN + 100 inserts + COMMIT, synchronous FULL. Higher is better. Same durability in every aozumi-db row.</text><text x="40" y="225" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">Turso 0.8, BEGIN CONCURRENT (MVCC)</text><path d="M340,206 h816.0 q4,0 4,4 v20 q0,4 -4,4 h-816.0 z" fill="#eb6834"/><text x="1168.0" y="225" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">≈9,500</text><text x="40" y="265" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, gp3, group commit</text><path d="M340,246 h132.12 q4,0 4,4 v20 q0,4 -4,4 h-132.12 z" fill="#2a78d6"/><text x="484.12" y="265" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">1,577</text><text x="40" y="305" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, local NVMe, group commit</text><path d="M340,286 h128.49473684210525 q4,0 4,4 v20 q0,4 -4,4 h-128.49473684210525 z" fill="#2a78d6"/><text x="480.4947368421052" y="305" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">1,535</text><text x="40" y="345" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, local NVMe, default</text><path d="M340,326 h127.28631578947369 q4,0 4,4 v20 q0,4 -4,4 h-127.28631578947369 z" fill="#8fb8ea"/><text x="479.2863157894737" y="345" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">1,521</text><text x="40" y="385" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">SQLite 3.50.2, in process</text><path d="M340,366 h114.25263157894737 q4,0 4,4 v20 q0,4 -4,4 h-114.25263157894737 z" fill="#eb6834"/><text x="466.2526315789474" y="385" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">≈1,370</text><text x="40" y="425" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, gp3, default</text><path d="M340,406 h32.166315789473686 q4,0 4,4 v20 q0,4 -4,4 h-32.166315789473686 z" fill="#8fb8ea"/><text x="384.1663157894737" y="425" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">419</text><text x="340" y="458" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">gp3 is the volume type production runs on: group commit takes it from 419 to 1,577 (3.8×), past SQLite's published figure.</text><text x="340" y="476" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">Turso and SQLite: Turso's 0.8 release post (hardware not stated). They run in process; aozumi-db answers over HTTP.</text><text x="40" y="520" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">YCSB, 1M records, 64 clients over the network: aozumi-db against mvSQLite's published run</text><text x="40" y="542" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Operations/s. Higher is better. mvSQLite: SQLite on FoundationDB, 3 replicas on 5 machines. aozumi-db: one server on local NVMe, default mode (2026-11-09).</text><line x1="110" x2="1240" y1="850.0" y2="850.0" stroke="#e6e5e1"/><text x="100" y="855.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">0</text><line x1="110" x2="1240" y1="798.0" y2="798.0" stroke="#e6e5e1"/><text x="100" y="803.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">10k</text><line x1="110" x2="1240" y1="746.0" y2="746.0" stroke="#e6e5e1"/><text x="100" y="751.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">20k</text><line x1="110" x2="1240" y1="694.0" y2="694.0" stroke="#e6e5e1"/><text x="100" y="699.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">30k</text><line x1="110" x2="1240" y1="642.0" y2="642.0" stroke="#e6e5e1"/><text x="100" y="647.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">40k</text><line x1="110" x2="1240" y1="590.0" y2="590.0" stroke="#e6e5e1"/><text x="100" y="595.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">50k</text><path d="M151.16666666666669,850 v-44.5368 q0,-4 4,-4 h44 q4,0 4,4 v44.5368 z" fill="#8fb8ea"/><text x="177.16666666666669" y="793.4632" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">9,334</text><path d="M205.16666666666669,850 v-16.3112 q0,-4 4,-4 h44 q4,0 4,4 v16.3112 z" fill="#eb6834"/><text x="231.16666666666669" y="821.6888" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">3,906</text><text x="204.16666666666669" y="872" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">A: 50% update</text><text x="204.16666666666669" y="892" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">2.4× faster</text><path d="M339.50000000000006,850 v-222.7044 q0,-4 4,-4 h44 q4,0 4,4 v222.7044 z" fill="#8fb8ea"/><text x="365.50000000000006" y="615.2956" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">43,597</text><path d="M393.50000000000006,850 v-40.98 q0,-4 4,-4 h44 q4,0 4,4 v40.98 z" fill="#eb6834"/><text x="419.50000000000006" y="797.02" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">8,650</text><text x="392.50000000000006" y="872" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">B: 5% update</text><text x="392.50000000000006" y="892" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">5.0× faster</text><path d="M527.8333333333334,850 v-236.5312 q0,-4 4,-4 h44 q4,0 4,4 v236.5312 z" fill="#8fb8ea"/><text x="553.8333333333334" y="601.4688" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">46,256</text><path d="M581.8333333333334,850 v-54.4636 q0,-4 4,-4 h44 q4,0 4,4 v54.4636 z" fill="#eb6834"/><text x="607.8333333333334" y="783.5364" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">11,243</text><text x="580.8333333333334" y="872" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">C: read only</text><text x="580.8333333333334" y="892" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">4.1× faster</text><path d="M716.1666666666666,850 v-214.7796 q0,-4 4,-4 h44 q4,0 4,4 v214.7796 z" fill="#8fb8ea"/><text x="742.1666666666666" y="623.2204" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">42,073</text><path d="M770.1666666666666,850 v-42.8052 q0,-4 4,-4 h44 q4,0 4,4 v42.8052 z" fill="#eb6834"/><text x="796.1666666666666" y="795.1948" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">9,001</text><text x="769.1666666666666" y="872" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">D: read latest</text><text x="769.1666666666666" y="892" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">4.7× faster</text><path d="M904.5,850 v-10.8356 q0,-4 4,-4 h44 q4,0 4,4 v10.8356 z" fill="#8fb8ea"/><text x="930.5" y="827.1644" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">2,853</text><path d="M958.5,850 v-52.8828 q0,-4 4,-4 h44 q4,0 4,4 v52.8828 z" fill="#eb6834"/><text x="984.5" y="785.1172" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">10,939</text><text x="957.5" y="872" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">E: short scans</text><text x="957.5" y="892" font-size="13" fill="#b3361b" text-anchor="middle" font-weight="600">3.8× slower</text><path d="M1092.8333333333335,850 v-38.1772 q0,-4 4,-4 h44 q4,0 4,4 v38.1772 z" fill="#8fb8ea"/><text x="1118.8333333333335" y="799.8228" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">8,111</text><path d="M1146.8333333333335,850 v-19.4832 q0,-4 4,-4 h44 q4,0 4,4 v19.4832 z" fill="#eb6834"/><text x="1172.8333333333335" y="818.5168" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">4,516</text><text x="1145.8333333333335" y="872" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">F: read-mod-write</text><text x="1145.8333333333335" y="892" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">1.8× faster</text><line x1="110" x2="1240" y1="850" y2="850" stroke="#8a8984"/><text x="40" y="926" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">This run predates group commit, which multiplied YCSB A by 8.6 and B by 4 on gp3 at 100k records / 32 clients (2026-11-10); not yet rerun at this scale.</text><text x="40" y="944" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">Different hardware, run lengths and durability guarantees: read as orders of magnitude, not exact ratios. mvSQLite: github.com/losfair/mvsqlite/wiki/YCSB-numbers.</text><text x="40" y="962" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">Raw output: bench/results/2026-11-09-published-comparison/ and 2026-11-10-group-commit/. Method: BENCHMARKS.md.</text></svg>