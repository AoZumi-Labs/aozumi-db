<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="920" viewBox="0 0 1280 920" font-family="Inter, Helvetica, Arial, sans-serif"><rect width="100%" height="100%" fill="#fcfcfb"/><text x="40" y="52" font-size="26" fill="#0b0b0b" text-anchor="start" font-weight="600">aozumi-db against published numbers</text><text x="40" y="80" font-size="14" fill="#52514e" text-anchor="start" font-weight="400">Only aozumi-db was run (AWS c7gd.2xlarge, Graviton3, synchronous = FULL, median of 3). Other figures are as their authors published them, on their own hardware.</text><rect x="40" y="98" width="14" height="14" rx="3" fill="#2a78d6"/><text x="60" y="110" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db (measured)</text><rect x="230" y="98" width="14" height="14" rx="3" fill="#eb6834"/><text x="250" y="110" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">published figure</text><text x="40" y="160" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">Concurrent writes: Turso's perf/throughput workload</text><text x="40" y="182" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Transactions/s at 64 connections (BEGIN + 100 inserts + COMMIT). Higher is better.</text><text x="40" y="228" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">Turso 0.8, BEGIN CONCURRENT (MVCC)</text><path d="M320,208 h396.0 q4,0 4,4 v22 q0,4 -4,4 h-396.0 z" fill="#eb6834"/><text x="728.0" y="228" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">≈9,500</text><text x="40" y="272" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, local NVMe, over HTTP</text><path d="M320,252 h60.04210526315789 q4,0 4,4 v22 q0,4 -4,4 h-60.04210526315789 z" fill="#2a78d6"/><text x="392.0421052631579" y="272" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">1,521</text><text x="40" y="316" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">SQLite 3.50.2, in process</text><path d="M320,296 h53.68421052631579 q4,0 4,4 v22 q0,4 -4,4 h-53.68421052631579 z" fill="#eb6834"/><text x="385.6842105263158" y="316" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">≈1,370</text><text x="40" y="360" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db, EBS gp3, over HTTP</text><path d="M320,340 h13.642105263157895 q4,0 4,4 v22 q0,4 -4,4 h-13.642105263157895 z" fill="#2a78d6"/><text x="345.6421052631579" y="360" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">419</text><text x="320" y="398" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">Turso and SQLite figures from Turso's 0.8 release post; their hardware is not stated there.</text><text x="860" y="160" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">Worst 0.1% (p99.9) at 32 connections</text><text x="860" y="182" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Lower is better. Log scale.</text><text x="860" y="228" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">SQLite</text><path d="M990,208 h196.0 q4,0 4,4 v22 q0,4 -4,4 h-196.0 z" fill="#eb6834"/><text x="1198.0" y="228" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">≈1.2 s</text><text x="860" y="272" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">aozumi-db NVMe</text><path d="M990,252 h119.73789319887942 q4,0 4,4 v22 q0,4 -4,4 h-119.73789319887942 z" fill="#2a78d6"/><text x="1121.7378931988794" y="272" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">33 ms</text><text x="860" y="316" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="400">Turso 0.8</text><path d="M990,296 h63.670993685260314 q4,0 4,4 v22 q0,4 -4,4 h-63.670993685260314 z" fill="#eb6834"/><text x="1065.6709936852603" y="316" font-size="14" fill="#0b0b0b" text-anchor="start" font-weight="600">≈2.4 ms</text><text x="40" y="440" font-size="18" fill="#0b0b0b" text-anchor="start" font-weight="600">YCSB, 1M records, 64 clients over the network: aozumi-db vs mvSQLite's published run</text><text x="40" y="462" font-size="13" fill="#52514e" text-anchor="start" font-weight="400">Operations/s per workload. Higher is better. mvSQLite: SQLite on FoundationDB, 3 replicas on 5 machines; aozumi-db: one 8-vCPU server.</text><line x1="110" x2="1240" y1="800.0" y2="800.0" stroke="#e6e5e1" stroke-width="1"/><text x="100" y="805.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">0</text><line x1="110" x2="1240" y1="742.0" y2="742.0" stroke="#e6e5e1" stroke-width="1"/><text x="100" y="747.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">10k</text><line x1="110" x2="1240" y1="684.0" y2="684.0" stroke="#e6e5e1" stroke-width="1"/><text x="100" y="689.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">20k</text><line x1="110" x2="1240" y1="626.0" y2="626.0" stroke="#e6e5e1" stroke-width="1"/><text x="100" y="631.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">30k</text><line x1="110" x2="1240" y1="568.0" y2="568.0" stroke="#e6e5e1" stroke-width="1"/><text x="100" y="573.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">40k</text><line x1="110" x2="1240" y1="510.0" y2="510.0" stroke="#e6e5e1" stroke-width="1"/><text x="100" y="515.0" font-size="12" fill="#8a8984" text-anchor="end" font-weight="400">50k</text><path d="M151.16666666666669,800 v-50.1372 q0,-4 4,-4 h44 q4,0 4,4 v50.1372 z" fill="#2a78d6"/><text x="177.16666666666669" y="737.8628" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">9,334</text><path d="M205.16666666666669,800 v-18.6548 q0,-4 4,-4 h44 q4,0 4,4 v18.6548 z" fill="#eb6834"/><text x="231.16666666666669" y="769.3452" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">3,906</text><text x="204.16666666666669" y="822" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">A: 50% update</text><text x="204.16666666666669" y="842" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">2.4× faster</text><path d="M339.50000000000006,800 v-248.8626 q0,-4 4,-4 h44 q4,0 4,4 v248.8626 z" fill="#2a78d6"/><text x="365.50000000000006" y="539.1374000000001" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">43,597</text><path d="M393.50000000000006,800 v-46.17 q0,-4 4,-4 h44 q4,0 4,4 v46.17 z" fill="#eb6834"/><text x="419.50000000000006" y="741.83" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">8,650</text><text x="392.50000000000006" y="822" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">B: 5% update</text><text x="392.50000000000006" y="842" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">5.0× faster</text><path d="M527.8333333333334,800 v-264.2848 q0,-4 4,-4 h44 q4,0 4,4 v264.2848 z" fill="#2a78d6"/><text x="553.8333333333334" y="523.7152" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">46,256</text><path d="M581.8333333333334,800 v-61.2094 q0,-4 4,-4 h44 q4,0 4,4 v61.2094 z" fill="#eb6834"/><text x="607.8333333333334" y="726.7906" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">11,243</text><text x="580.8333333333334" y="822" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">C: read only</text><text x="580.8333333333334" y="842" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">4.1× faster</text><path d="M716.1666666666666,800 v-240.0234 q0,-4 4,-4 h44 q4,0 4,4 v240.0234 z" fill="#2a78d6"/><text x="742.1666666666666" y="547.9766" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">42,073</text><path d="M770.1666666666666,800 v-48.2058 q0,-4 4,-4 h44 q4,0 4,4 v48.2058 z" fill="#eb6834"/><text x="796.1666666666666" y="739.7942" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">9,001</text><text x="769.1666666666666" y="822" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">D: read latest</text><text x="769.1666666666666" y="842" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">4.7× faster</text><path d="M904.5,800 v-12.5474 q0,-4 4,-4 h44 q4,0 4,4 v12.5474 z" fill="#2a78d6"/><text x="930.5" y="775.4526" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">2,853</text><path d="M958.5,800 v-59.4462 q0,-4 4,-4 h44 q4,0 4,4 v59.4462 z" fill="#eb6834"/><text x="984.5" y="728.5538" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">10,939</text><text x="957.5" y="822" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">E: short scans</text><text x="957.5" y="842" font-size="13" fill="#b3361b" text-anchor="middle" font-weight="600">3.8× slower</text><path d="M1092.8333333333335,800 v-43.0438 q0,-4 4,-4 h44 q4,0 4,4 v43.0438 z" fill="#2a78d6"/><text x="1118.8333333333335" y="744.9562" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">8,111</text><path d="M1146.8333333333335,800 v-22.1928 q0,-4 4,-4 h44 q4,0 4,4 v22.1928 z" fill="#eb6834"/><text x="1172.8333333333335" y="765.8072" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="600">4,516</text><text x="1145.8333333333335" y="822" font-size="14" fill="#0b0b0b" text-anchor="middle" font-weight="600">F: read-mod-write</text><text x="1145.8333333333335" y="842" font-size="13" fill="#52514e" text-anchor="middle" font-weight="600">1.8× faster</text><line x1="110" x2="1240" y1="800" y2="800" stroke="#8a8984" stroke-width="1"/><text x="40" y="880" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">aozumi-db: commit d84b06d, AWS ap-south-1, separate c7g.2xlarge load generator (0.4 ms RTT), 60 s per workload. mvSQLite: github.com/losfair/mvsqlite/wiki/YCSB-numbers, 200 s per workload.</text><text x="40" y="898" font-size="12" fill="#8a8984" text-anchor="start" font-weight="400">Different hardware, run lengths and durability guarantees: read as orders of magnitude, not exact ratios. Raw output: bench/results/2026-11-09-published-comparison/.</text></svg>